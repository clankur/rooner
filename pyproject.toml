[project]
name = "pooner"
version = "0.1.0"
description = "Live RuneScape RLVR with verified rewards and Tinker training"
requires-python = ">=3.11"

dependencies = [
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "tinker==0.35.0",
    "transformers==5.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = ["pytest==9.0.3"]
docs = ["jupyter>=1.1.1", "plotly>=6.7.0"]
